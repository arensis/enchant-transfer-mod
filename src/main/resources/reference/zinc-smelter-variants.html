<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Horno de Zinc — 3 Variantes</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3eee3; --bg-card:#fbf8f1; --ink:#1f1a14; --ink-soft:#5a5145; --ink-faint:#8a7f6f; --rule:#d9cfb8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:Helvetica,Arial,sans-serif; font-size:15px; line-height:1.55; }
  .wrap{ max-width:1260px; margin:0 auto; padding:48px 32px 120px; }
  header{ border-bottom:1px solid var(--rule); padding-bottom:28px; margin-bottom:40px; }
  .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); margin-bottom:10px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:38px; line-height:1.1; margin:0 0 10px; letter-spacing:-.02em; }
  .lede{ font-size:16px; color:var(--ink-soft); max-width:720px; }
  h2{ font-family:'Silkscreen',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-faint); margin:0 0 8px; padding-bottom:12px; border-bottom:1px solid var(--rule); }
  section{ margin-bottom:56px; }

  /* 3-up grid */
  .trio{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:20px; }
  .variant-card{ background:var(--bg-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  .variant-card.pick{ border-color:#e89040; box-shadow:0 0 0 2px #e89040; }
  .vp-label{ padding:14px 16px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--rule); }
  .vp-label .badge{ font-family:'Silkscreen',monospace; font-size:10px; background:#2a1408; color:#e89040; padding:3px 8px; border-radius:4px; letter-spacing:.06em; }
  .vp-label h3{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
  .vp-label p{ font-size:12px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; margin-left:auto; }
  .viewport{ background:radial-gradient(ellipse at 50% 35%,#2c2740 0%,#0c0a13 70%); height:340px; position:relative; overflow:hidden; perspective:1200px; cursor:grab; }
  .viewport:active{ cursor:grabbing; }
  .world{ position:absolute; left:50%; top:54%; transform-style:preserve-3d; }
  .box{ position:absolute; transform-style:preserve-3d; left:0; top:0; }
  .face{ position:absolute; left:50%; top:50%; }
  .hint{ position:absolute; bottom:8px; left:0; right:0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:10px; color:rgba(255,255,255,0.3); pointer-events:none; }
  .vp-details{ padding:14px 16px; font-size:12px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; line-height:1.7; }
  .vp-details dt{ color:var(--ink); font-weight:700; display:inline; }
  .vp-details dd{ display:inline; margin:0; }
  .vp-details dd::after{ content:''; display:block; }

  /* Items */
  .items-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:20px; }
  .item-card{ background:var(--bg-card); border:1px solid var(--rule); border-radius:8px; padding:20px; text-align:center; }
  .item-card canvas{ image-rendering:pixelated; border:1px solid var(--rule); margin-bottom:10px; }
  .item-card h4{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:0 0 4px; }
  .item-card p{ font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; }

  /* Controls bar */
  .controls-bar{ display:flex; gap:14px; align-items:center; margin-top:16px; padding:14px 20px; background:var(--bg-card); border:1px solid var(--rule); border-radius:8px; flex-wrap:wrap; }
  .controls-bar label{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .controls-bar label .val{ color:#d86828; font-weight:700; min-width:32px; }
  .controls-bar input[type=range]{ width:120px; accent-color:#e87830; }
  .cbtn{ padding:6px 14px; border:1px solid var(--rule); background:var(--bg); border-radius:5px; font-family:'Silkscreen',monospace; font-size:9px; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; color:var(--ink-soft); transition:all .15s; }
  .cbtn:hover{ background:#e8dfd0; }
  .cbtn.active{ background:#2a1408; color:#e89040; border-color:#2a1408; }
  .spacer{ flex:1; }

  .legend-row{ display:flex; gap:20px; flex-wrap:wrap; padding:12px 20px; background:var(--bg-card); border:1px solid var(--rule); border-radius:8px; margin-top:10px; font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; }
  .legend-row span{ display:flex; align-items:center; gap:5px; }
  .sw{ display:inline-block; width:10px; height:10px; border-radius:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Horno de Zinc · Comparativa de Variantes</div>
    <h1>Horno de Zinc — 3 Variantes</h1>
    <p class="lede">Arrastra cada viewport para orbitar · rueda para zoom. Las 3 variantes comparten materiales y cadena de recetas; difieren en silueta y detalles.</p>
  </header>

  <section>
    <h2>01 · Modelos 3D</h2>
    <div class="controls-bar">
      <label>Lava <span class="val" id="lvl-val">70%</span>
        <input type="range" id="lvl" min="0" max="100" value="70">
      </label>
      <button class="cbtn active" id="btn-smelt">🔥 Fundiendo</button>
      <button class="cbtn" id="btn-idle">Idle</button>
      <span class="spacer"></span>
      <button class="cbtn active" id="btn-spin">⟳ Girar</button>
      <button class="cbtn" id="btn-reset">Reset</button>
    </div>
    <div class="trio" id="trio"></div>
    <div class="legend-row">
      <span><span class="sw" style="background:#b86a28;"></span><b>Cobre</b></span>
      <span><span class="sw" style="background:#c89030;"></span><b>Latón</b></span>
      <span><span class="sw" style="background:#484848;"></span><b>Hierro</b></span>
      <span><span class="sw" style="background:#e85818;"></span><b>Lava</b></span>
      <span><span class="sw" style="background:#1a3830;border:1px solid #30d4c0;"></span><b>Cristal</b></span>
    </div>
  </section>

  <section>
    <h2>02 · Texturas de Items</h2>
    <div class="items-row" id="items-row"></div>
  </section>
</div>

<script>
const S = 4.8;
const variants = [
  { id:'A', name:'Compact Smelter', desc:'Cuerpo sólido, mirilla frontal, chimenea simple. Silueta limpia.',
    details: [
      ['Base','16×3×16 hierro + remaches latón'],
      ['Cuerpo','16×12×16 cobre, aristas reforzadas'],
      ['Mirilla','6×4 cristal ahumado frontal'],
      ['Tapa','18×2×18 latón pulido'],
      ['Chimenea','3.5×5 cobre + tapa latón'],
      ['Extras','Manómetro lateral, rejilla frontal, asa'],
    ]},
  { id:'B', name:'Industrial Forge', desc:'Patas de hierro, chimenea doble, mirilla ancha. Aspecto fabril.',
    details: [
      ['Patas','4× patas hierro con tuercas latón'],
      ['Base','16×1×16 placa hierro'],
      ['Cuerpo','16×10×16 cobre + chaflanes hierro'],
      ['Mirilla','10×4 cristal ancho + frame latón'],
      ['Chimeneas','2× tubos cobre con tapas latón'],
      ['Extras','Tubos laterales cobre/latón'],
    ]},
  { id:'C', name:'Ornate Kiln', desc:'Esquinas achaflanadas, puerta con bisagras, chimenea centrada ornamental.',
    details: [
      ['Base','18×2×18 latón ornamental'],
      ['Cuerpo','15×12×15 cobre, aristas latón decorativas'],
      ['Puerta','8×6 con bisagras + mirilla integrada'],
      ['Bandas','3× anillos latón decorativos'],
      ['Chimenea','4×5 centrada + remates latón'],
      ['Extras','Ornamento en tapa, tubo lateral'],
    ]},
];

// ── Rendering engine ────────────────────────────────────────────────────────
const COPPER=[176,106,44], BRASS=[200,148,56], GLASS=[26,56,52], IRON=[72,72,74];
const LAVA=[232,88,24], LAVA_GLOW=[255,140,40];
const SMF = { front:.90, back:.70, right:.62, left:.56, top:1.0, bottom:.38 };

function shade(rgb, f){ return `rgb(${Math.round(rgb[0]*f)},${Math.round(rgb[1]*f)},${Math.round(rgb[2]*f)})`; }
function shadeA(rgb, f, a){ return `rgba(${Math.round(rgb[0]*f)},${Math.round(rgb[1]*f)},${Math.round(rgb[2]*f)},${a})`; }

function mkTex(kind) {
  const c = document.createElement('canvas'); c.width=16; c.height=16;
  const x = c.getContext('2d');
  if (kind === 'copper') {
    x.fillStyle='#b86a28'; x.fillRect(0,0,16,16);
    [[0,'#c47630'],[1,'#b86a28'],[2,'#c07030'],[3,'#c87a34'],[4,'#b46228'],[5,'#c27232'],
     [6,'#be6e2e'],[7,'#d08040'],[8,'#c47630'],[9,'#b86228'],[10,'#c47030'],[11,'#bc6a2c'],
     [12,'#c87a34'],[13,'#b86228'],[14,'#a85e24'],[15,'#b86a28']].forEach(([y,c])=>{x.fillStyle=c;x.fillRect(0,y,16,1);});
    x.fillStyle='#e89858'; x.fillRect(2,2,6,1); x.fillRect(4,5,4,1);
    x.fillStyle='#d88040'; x.fillRect(0,0,16,1); x.fillRect(0,0,1,16);
    x.fillStyle='#7a3a10'; x.fillRect(0,15,16,1); x.fillRect(15,0,1,16);
  } else if (kind === 'brass') {
    x.fillStyle='#c89030'; x.fillRect(0,0,16,16);
    [[0,'#d49a3a'],[1,'#c89030'],[2,'#d09838'],[3,'#d89c3c'],[4,'#c48828'],[5,'#d29638'],
     [6,'#ce9234'],[7,'#dea040'],[8,'#d49a3a'],[9,'#c68c2c'],[10,'#d49838'],[11,'#cc8e32'],
     [12,'#d89c3c'],[13,'#c68a2c'],[14,'#be8428'],[15,'#c89030']].forEach(([y,c])=>{x.fillStyle=c;x.fillRect(0,y,16,1);});
    x.fillStyle='#f0c860'; x.fillRect(2,2,6,1);
    x.fillStyle='#e8b050'; x.fillRect(0,0,16,1); x.fillRect(0,0,1,16);
    x.fillStyle='#8a5c14'; x.fillRect(0,15,16,1); x.fillRect(15,0,1,16);
  } else if (kind === 'iron') {
    x.fillStyle='#484848'; x.fillRect(0,0,16,16);
    let s=17; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
    for(let i=0;i<55;i++){const px=Math.floor(rnd()*16),py=Math.floor(rnd()*16),v=rnd();x.fillStyle=v<.35?'#383838':v<.7?'#505050':'#5c5c5c';x.fillRect(px,py,1,1);}
    x.fillStyle='#5e5e5e'; x.fillRect(0,0,16,1); x.fillRect(0,0,1,16);
    x.fillStyle='#2c2c2c'; x.fillRect(0,15,16,1); x.fillRect(15,0,1,16);
  } else if (kind === 'lava') {
    x.fillStyle='#c83808'; x.fillRect(0,0,16,16);
    for(let y=0;y<16;y++){const v=Math.sin(y*0.7)*0.15+0.85;x.fillStyle=`rgb(${Math.round(232*v)},${Math.round(88*v+y*3)},${Math.round(24*v)})`;x.fillRect(0,y,16,1);}
    x.fillStyle='#ff9820'; x.fillRect(3,4,4,2); x.fillRect(9,8,5,2);
    x.fillStyle='#ffe870'; x.fillRect(4,4,2,1); x.fillRect(10,8,3,1);
  }
  return c.toDataURL();
}
const TEX_COPPER=mkTex('copper'), TEX_BRASS=mkTex('brass'), TEX_IRON=mkTex('iron'), TEX_LAVA=mkTex('lava');
const copperF=n=>shade(COPPER,SMF[n]); copperF.tex=TEX_COPPER;
const brassF=n=>shade(BRASS,SMF[n]); brassF.tex=TEX_BRASS;
const ironF=n=>shade(IRON,SMF[n]); ironF.tex=TEX_IRON;
const glassF=n=>shadeA(GLASS,SMF[n]*1.1,0.55);
const lavaF=n=>shade(LAVA,SMF[n]); lavaF.tex=TEX_LAVA;
const lavaGlF=n=>shadeA(LAVA_GLOW,SMF[n],0.7);

function makeBox(parent,x,y,z,w,h,d,colorFn){
  const box=document.createElement('div'); box.className='box';
  box.style.transform=`translate3d(${x*S}px,${-y*S}px,${z*S}px)`;
  const W=w*S,H=h*S,D=d*S;
  [{n:'front',t:`translate(-50%,-50%) translateZ(${D/2}px)`,w:W,h:H},
   {n:'back',t:`translate(-50%,-50%) rotateY(180deg) translateZ(${D/2}px)`,w:W,h:H},
   {n:'right',t:`translate(-50%,-50%) rotateY(90deg) translateZ(${W/2}px)`,w:D,h:H},
   {n:'left',t:`translate(-50%,-50%) rotateY(-90deg) translateZ(${W/2}px)`,w:D,h:H},
   {n:'top',t:`translate(-50%,-50%) rotateX(90deg) translateZ(${H/2}px)`,w:W,h:D},
   {n:'bottom',t:`translate(-50%,-50%) rotateX(-90deg) translateZ(${H/2}px)`,w:W,h:D}
  ].forEach(f=>{
    const el=document.createElement('div'); el.className='face';
    el.style.width=f.w+'px'; el.style.height=f.h+'px'; el.style.transform=f.t;
    if(colorFn.tex){const fac=SMF[f.n],ov=(fac>=1?0:(1-fac)*0.85).toFixed(2);
      el.style.backgroundImage=`linear-gradient(rgba(0,0,0,${ov}),rgba(0,0,0,${ov})),url(${colorFn.tex})`;
      el.style.backgroundSize='cover'; el.style.imageRendering='pixelated';
    } else { el.style.background=colorFn(f.n); }
    box.appendChild(el);
  });
  parent.appendChild(box); return box;
}

// ── State ───────────────────────────────────────────────────────────────────
let lavaLevel=0.7, isSmelting=true, spinning=true;
const worlds=[], partSets=[], rots=[{x:-22,y:30,d:0},{x:-22,y:30,d:0},{x:-22,y:30,d:0}];

function smoke(world,parts,cx,cz,baseY){
  if(!isSmelting) return;
  for(let i=0;i<3;i++){
    const s=document.createElement('div'); s.className='box';
    s.style.transform=`translate3d(${cx*S}px,${-(baseY+i*3)*S}px,${cz*S}px)`;
    s.innerHTML=`<div class="face" style="width:${(2+i)*S}px;height:${(1.5+i*.5)*S}px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(160,150,140,${.3-i*.08}),transparent 70%);border-radius:50%;"></div>`;
    world.appendChild(s); parts.push(s);
  }
}
function lavaGlow(world,parts,x,y,z,w,h){
  if(!isSmelting || lavaLevel<0.1) return;
  const g=makeBox(world,x,y,z,w,h,0.3,lavaGlF);
  g.style.filter='drop-shadow(0 0 8px rgba(255,100,20,0.6))';
  g.style.animation='1.5s ease-in-out infinite alternate flamePulse';
  parts.push(g);
}
function addFire(world,parts,cx,cy,cz,fw,fh){
  if(!isSmelting || lavaLevel<0.05) return;
  // Fire panel placed on the front face of the mirilla
  const fireBox=document.createElement('div'); fireBox.className='box';
  fireBox.style.transform=`translate3d(${cx*S}px,${-cy*S}px,${cz*S}px)`;
  const W=fw*S, H=fh*S;
  const panel=document.createElement('div'); panel.className='face';
  panel.style.width=W+'px'; panel.style.height=H+'px';
  panel.style.transform=`translate(-50%,-50%) translateZ(${0.2*S}px)`;
  panel.style.background='transparent'; panel.style.overflow='hidden';
  // Fire container with flames
  const fc=document.createElement('div'); fc.className='fire-container';
  fc.innerHTML='<div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div><div class="flame f4"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div>';
  panel.appendChild(fc);
  // Orange ambient glow behind
  const glow=document.createElement('div');
  glow.style.cssText='position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(255,120,20,0.7),rgba(255,80,10,0.3) 60%,transparent 100%);animation:flamePulse 1.2s ease-in-out infinite alternate;';
  panel.appendChild(glow);
  fireBox.appendChild(panel);
  world.appendChild(fireBox); parts.push(fireBox);
}

// ── Build functions ─────────────────────────────────────────────────────────
function buildA(world,parts){
  // Shadow
  const gnd=document.createElement('div'); gnd.className='box';
  gnd.style.transform='translate3d(0,0,0) rotateX(90deg)';
  gnd.innerHTML=`<div class="face" style="width:${22*S}px;height:${18*S}px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(0,0,0,0.4),transparent 68%);"></div>`;
  world.appendChild(gnd); parts.push(gnd);

  parts.push(makeBox(world,8,1.5,8,16,3,16,ironF));
  [[-7,-7],[-7,7],[7,-7],[7,7]].forEach(([dx,dz])=>{
    parts.push(makeBox(world,8+dx,1.5,8+dz,2.2,3.4,2.2,brassF));
  });
  const lH=3.5*lavaLevel;
  if(lH>.1){ const lv=makeBox(world,8,3+lH/2,8,13,lH,13,lavaF); if(isSmelting)lv.style.filter='drop-shadow(0 0 6px rgba(255,100,20,0.7))'; parts.push(lv); }
  parts.push(makeBox(world,8,9,8,16,12,16,copperF));
  [[-7.5,-7.5],[-7.5,7.5],[7.5,-7.5],[7.5,7.5]].forEach(([dx,dz])=>{
    parts.push(makeBox(world,8+dx,9,8+dz,1.5,12,1.5,copperF));
    [5,9,13].forEach(ry=>parts.push(makeBox(world,8+dx,ry,8+dz,1.8,.8,1.8,brassF)));
  });
  parts.push(makeBox(world,8,10,8,17,1,17,brassF));
  parts.push(makeBox(world,8,5.5,16.3,7,4,.6,glassF));
  parts.push(makeBox(world,8,5.5,16.5,8,.6,.4,brassF));
  parts.push(makeBox(world,8,3.2,16.5,8,.6,.4,brassF));
  parts.push(makeBox(world,8,7.8,16.5,8,.6,.4,brassF));
  parts.push(makeBox(world,4.5,5.5,16.5,.6,4.5,.4,brassF));
  parts.push(makeBox(world,11.5,5.5,16.5,.6,4.5,.4,brassF));
  lavaGlow(world,parts,8,5.5,16.6,6.5,3.5);
  addFire(world,parts,8,5.5,16.5,6,3.5);
  parts.push(makeBox(world,8,16,8,18,2,18,brassF));
  parts.push(makeBox(world,8,17.2,8,14,.6,14,copperF));
  parts.push(makeBox(world,11,19.5,11,3.5,5,3.5,copperF));
  parts.push(makeBox(world,11,22.5,11,5,1.5,5,brassF));
  [[1.2,1.2],[1.2,-1.2],[-1.2,1.2],[-1.2,-1.2]].forEach(([dx,dz])=>parts.push(makeBox(world,11+dx,19.5,11+dz,.5,5,.5,ironF)));
  smoke(world,parts,11,11,24);
  for(let i=0;i<4;i++) parts.push(makeBox(world,4.5+i*2.3,12,16.3,.5,3,.4,ironF));
  parts.push(makeBox(world,16.5,12,8,1.5,3,3.5,brassF));
  parts.push(makeBox(world,17.2,12,8,.6,2,2.2,n=>`rgba(10,10,14,${SMF[n]*0.85})`));
  if(isSmelting) parts.push(makeBox(world,17.5,12.8,8,.3,1.2,.3,n=>`rgba(200,240,48,0.9)`));
  parts.push(makeBox(world,-.5,12,8,1.2,2.5,1.5,ironF));
  parts.push(makeBox(world,-1.2,12,8,.8,4,.8,copperF));
}

function buildB(world,parts){
  const gnd=document.createElement('div'); gnd.className='box';
  gnd.style.transform='translate3d(0,0,0) rotateX(90deg)';
  gnd.innerHTML=`<div class="face" style="width:${22*S}px;height:${18*S}px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(0,0,0,0.4),transparent 68%);"></div>`;
  world.appendChild(gnd); parts.push(gnd);

  [[-6,-6],[-6,6],[6,-6],[6,6]].forEach(([dx,dz])=>{
    parts.push(makeBox(world,8+dx,1.5,8+dz,2,3,2,ironF));
    parts.push(makeBox(world,8+dx,.3,8+dz,2.8,.6,2.8,brassF));
  });
  parts.push(makeBox(world,8,3.5,8,16,1,16,ironF));
  const lH=3.5*lavaLevel;
  if(lH>.1){const lv=makeBox(world,8,4+lH/2,8,13,lH,13,lavaF);if(isSmelting)lv.style.filter='drop-shadow(0 0 6px rgba(255,100,20,0.7))';parts.push(lv);}
  parts.push(makeBox(world,8,9,8,16,10,16,copperF));
  [[-6.5],[6.5]].forEach(([dx])=>parts.push(makeBox(world,8+dx,9,16.2,2.5,10,.5,ironF)));
  parts.push(makeBox(world,8,6,16.3,10,4,.6,glassF));
  parts.push(makeBox(world,8,8.2,16.5,11,.5,.4,brassF));
  parts.push(makeBox(world,8,3.8,16.5,11,.5,.4,brassF));
  parts.push(makeBox(world,3,6,16.5,.5,4.5,.4,brassF));
  parts.push(makeBox(world,13,6,16.5,.5,4.5,.4,brassF));
  lavaGlow(world,parts,8,6,16.6,9,3.5);
  addFire(world,parts,8,6,16.5,8.5,3.5);
  parts.push(makeBox(world,8,11,8,17,1,17,brassF));
  parts.push(makeBox(world,8,7,8,17,.6,17,brassF));
  parts.push(makeBox(world,8,14.5,8,18,1.5,18,brassF));
  parts.push(makeBox(world,8,15.5,8,16,.6,16,ironF));
  parts.push(makeBox(world,10,18,10,3,5,3,copperF));
  parts.push(makeBox(world,10,21,10,4.5,1.2,4.5,brassF));
  parts.push(makeBox(world,6,17.5,10,2.5,4,2.5,copperF));
  parts.push(makeBox(world,6,20,10,3.5,1,3.5,brassF));
  smoke(world,parts,10,10,23);
  parts.push(makeBox(world,-1,10,8,2.5,3,2.5,copperF));
  parts.push(makeBox(world,-1,10,8,3,.8,3,brassF));
  parts.push(makeBox(world,17,10,8,2.5,3,2.5,copperF));
  parts.push(makeBox(world,17,10,8,3,.8,3,brassF));
  [[-7,-7],[-7,7],[7,-7],[7,7]].forEach(([dx,dz])=>{
    [6,10,13].forEach(ry=>parts.push(makeBox(world,8+dx,ry,8+dz,1.6,.8,1.6,brassF)));
  });
}

function buildC(world,parts){
  const gnd=document.createElement('div'); gnd.className='box';
  gnd.style.transform='translate3d(0,0,0) rotateX(90deg)';
  gnd.innerHTML=`<div class="face" style="width:${22*S}px;height:${18*S}px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(0,0,0,0.4),transparent 68%);"></div>`;
  world.appendChild(gnd); parts.push(gnd);

  parts.push(makeBox(world,8,1,8,18,2,18,brassF));
  parts.push(makeBox(world,8,.2,8,16,.6,16,ironF));
  const lH=3*lavaLevel;
  if(lH>.1){const lv=makeBox(world,8,2+lH/2,8,12,lH,12,lavaF);if(isSmelting)lv.style.filter='drop-shadow(0 0 6px rgba(255,100,20,0.7))';parts.push(lv);}
  parts.push(makeBox(world,8,8,8,15,12,15,copperF));
  [[-6.5,-6.5],[-6.5,6.5],[6.5,-6.5],[6.5,6.5]].forEach(([dx,dz])=>{
    parts.push(makeBox(world,8+dx,8,8+dz,2.5,12,2.5,brassF));
    [4,8,12].forEach(ry=>parts.push(makeBox(world,8+dx,ry,8+dz,1.2,1.2,1.2,copperF)));
  });
  parts.push(makeBox(world,8,6,16,8,6,1,copperF));
  parts.push(makeBox(world,4.2,8,16.5,.8,1.2,.8,brassF));
  parts.push(makeBox(world,4.2,5,16.5,.8,1.2,.8,brassF));
  parts.push(makeBox(world,11.5,6,16.6,.6,2,.6,ironF));
  parts.push(makeBox(world,8,6,16.8,4,3,.4,glassF));
  lavaGlow(world,parts,8,6,16.9,3.5,2.5);
  addFire(world,parts,8,6,16.9,3.2,2.8);
  parts.push(makeBox(world,8,5,8,16,.6,16,brassF));
  parts.push(makeBox(world,8,10,8,16,.6,16,brassF));
  parts.push(makeBox(world,8,13,8,16,.6,16,brassF));
  parts.push(makeBox(world,8,14.5,8,17,1.5,17,brassF));
  parts.push(makeBox(world,8,15.5,8,13,1,13,copperF));
  parts.push(makeBox(world,8,16.5,8,5,.8,5,brassF));
  parts.push(makeBox(world,8,19,8,4,5,4,copperF));
  parts.push(makeBox(world,8,18,8,5.5,1,5.5,brassF));
  parts.push(makeBox(world,8,22,8,6,1.5,6,brassF));
  parts.push(makeBox(world,8,23,8,4.5,.8,4.5,copperF));
  smoke(world,parts,8,8,25);
  parts.push(makeBox(world,-.5,9,8,2,3,2.5,copperF));
  parts.push(makeBox(world,-.5,9,8,2.5,.6,3,brassF));
}

const builders=[buildA,buildB,buildC];

// ── Create DOM ──────────────────────────────────────────────────────────────
const trio=document.getElementById('trio');
variants.forEach((v,i)=>{
  const card=document.createElement('div'); card.className='variant-card'; card.id='vc-'+v.id;
  let dtHtml='<dl>';
  v.details.forEach(([k,val])=>dtHtml+=`<dt>${k}</dt><dd>${val}</dd>`);
  dtHtml+='</dl>';
  card.innerHTML=`
    <div class="vp-label"><span class="badge">${v.id}</span><h3>${v.name}</h3><p>1×1×1</p></div>
    <div class="viewport" id="vp-${i}"><div class="world" id="w-${i}"></div><div class="hint">arrastra · rueda</div></div>
    <div class="vp-details">${dtHtml}</div>`;
  trio.appendChild(card);
  worlds.push(document.getElementById('w-'+i));
  partSets.push([]);
});

// ── Build all ───────────────────────────────────────────────────────────────
function rebuildAll(){
  for(let i=0;i<3;i++){
    partSets[i].forEach(el=>el.remove());
    partSets[i]=[];
    const w=worlds[i], p=partSets[i];
    builders[i](w,p);
  }
}
rebuildAll();

// ── Interaction (per viewport) ──────────────────────────────────────────────
for(let i=0;i<3;i++){
  const vp=document.getElementById('vp-'+i);
  let dragging=false, lx=0, ly=0;
  function applyT(idx){ worlds[idx].style.transform=`translateZ(${rots[idx].d}px) rotateX(${rots[idx].x}deg) rotateY(${rots[idx].y}deg)`; }
  vp.addEventListener('pointerdown',e=>{
    dragging=true; spinning=false; document.getElementById('btn-spin').classList.remove('active');
    lx=e.clientX; ly=e.clientY; vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove',e=>{
    if(!dragging) return;
    rots[i].y+=(e.clientX-lx)*.5; rots[i].x+=(e.clientY-ly)*.5;
    rots[i].x=Math.max(-80,Math.min(80,rots[i].x));
    lx=e.clientX; ly=e.clientY; applyT(i);
  });
  vp.addEventListener('pointerup',()=>dragging=false);
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    rots[i].d=Math.max(-200,Math.min(120,rots[i].d-e.deltaY*.3)); applyT(i);
  },{passive:false});
  applyT(i);
}

// ── Controls ────────────────────────────────────────────────────────────────
document.getElementById('lvl').addEventListener('input',e=>{
  lavaLevel=e.target.value/100;
  document.getElementById('lvl-val').textContent=Math.round(lavaLevel*100)+'%';
  rebuildAll();
});
document.getElementById('btn-idle').addEventListener('click',()=>{
  isSmelting=false;
  document.getElementById('btn-idle').classList.add('active');
  document.getElementById('btn-smelt').classList.remove('active');
  rebuildAll();
});
document.getElementById('btn-smelt').addEventListener('click',()=>{
  isSmelting=true;
  document.getElementById('btn-smelt').classList.add('active');
  document.getElementById('btn-idle').classList.remove('active');
  rebuildAll();
});
document.getElementById('btn-spin').addEventListener('click',function(){
  spinning=!spinning; this.classList.toggle('active',spinning);
});
document.getElementById('btn-reset').addEventListener('click',()=>{
  rots.forEach(r=>{r.x=-22;r.y=30;r.d=0;});
  worlds.forEach((w,i)=>w.style.transform=`translateZ(0px) rotateX(-22deg) rotateY(30deg)`);
});

// ── Spin loop ───────────────────────────────────────────────────────────────
let t0=performance.now();
(function loop(now){
  const dt=(now-t0)/1000; t0=now;
  if(spinning){
    rots.forEach((r,i)=>{
      r.y=(r.y+dt*18)%360;
      worlds[i].style.transform=`translateZ(${r.d}px) rotateX(${r.x}deg) rotateY(${r.y}deg)`;
    });
  }
  requestAnimationFrame(loop);
})(performance.now());

// ── CSS for flame pulse ─────────────────────────────────────────────────────
const style=document.createElement('style');
style.textContent=`
@keyframes flamePulse{0%{opacity:.6;transform:scaleY(.85)}100%{opacity:1;transform:scaleY(1.05)}}
@keyframes fireFlicker1{0%{height:60%;opacity:.9}25%{height:80%;opacity:1}50%{height:55%;opacity:.85}75%{height:75%;opacity:.95}100%{height:60%;opacity:.9}}
@keyframes fireFlicker2{0%{height:45%;opacity:.8}30%{height:65%;opacity:.95}60%{height:40%;opacity:.75}100%{height:45%;opacity:.8}}
@keyframes fireFlicker3{0%{height:35%;opacity:.7}40%{height:55%;opacity:.85}70%{height:30%;opacity:.65}100%{height:35%;opacity:.7}}
@keyframes emberFloat{0%{bottom:10%;opacity:1;transform:translateX(0)}50%{opacity:.8}100%{bottom:85%;opacity:0;transform:translateX(3px)}}
.fire-container{position:absolute;bottom:0;left:0;right:0;top:0;overflow:hidden;pointer-events:none;}
.flame{position:absolute;bottom:0;border-radius:50% 50% 20% 20%;filter:blur(0.3px);}
.flame.f1{left:15%;width:35%;background:linear-gradient(0deg,#ff4400 0%,#ff8800 40%,#ffcc00 80%,rgba(255,230,100,0) 100%);animation:fireFlicker1 0.8s ease-in-out infinite alternate;}
.flame.f2{left:45%;width:28%;background:linear-gradient(0deg,#ff5500 0%,#ff9920 50%,#ffdd44 85%,rgba(255,230,100,0) 100%);animation:fireFlicker2 1.1s ease-in-out infinite alternate;}
.flame.f3{left:25%;width:22%;background:linear-gradient(0deg,#ff6600 0%,#ffaa30 60%,rgba(255,200,60,0) 100%);animation:fireFlicker3 0.7s ease-in-out infinite alternate;}
.flame.f4{left:55%;width:20%;background:linear-gradient(0deg,#ff3300 0%,#ff7700 50%,rgba(255,180,40,0) 100%);animation:fireFlicker1 0.9s ease-in-out infinite alternate-reverse;}
.ember{position:absolute;width:2px;height:2px;background:#ffcc44;border-radius:50%;animation:emberFloat 1.4s ease-out infinite;}
.ember:nth-child(2){left:30%;animation-delay:.3s;animation-duration:1.8s;}
.ember:nth-child(3){left:60%;animation-delay:.7s;animation-duration:1.2s;}
`;
document.head.appendChild(style);

// ── ITEM TEXTURES ───────────────────────────────────────────────────────────
(function(){
  const grid=document.getElementById('items-row');
  const items=[
    {name:'Lingote de Latón',id:'brass_ingot',desc:'item/brass_ingot.png'},
    {name:'Óxido de Zinc',id:'zinc_oxide',desc:'item/zinc_oxide.png'},

  ];
  function drawBrassIngot(c){

    c.fillStyle='#ffffff';c.fillRect(7,6,1,1);c.fillRect(9,8,1,1);
    c.fillStyle='#ccc8c0';c.fillRect(6,10,1,1);c.fillRect(10,9,1,1);
    c.fillStyle='#c0c8d8';c.fillRect(8,7,1,1);c.fillRect(5,9,1,1);
  }
  function drawZincSheet(c){
    c.fillStyle='#9098a8';c.fillRect(3,4,10,9);

    c.fillStyle='#a8b0c0';c.fillRect(3,5,10,1);
    c.fillStyle='#a0a8b8';c.fillRect(3,4,1,9);
    c.fillStyle='#788090';c.fillRect(12,4,1,9);

    c.fillStyle='#c8d0e0';c.fillRect(4,5,2,1);c.fillRect(7,7,1,1);
    c.fillStyle='#b8c0d0';c.fillRect(3,4,1,1);
    c.fillStyle='#606878';c.fillRect(12,12,1,1);
  }
  const fns={brass_ingot:drawBrassIngot,zinc_oxide:drawZincOxide,zinc_sheet:drawZincSheet};
  items.forEach(item=>{
    const card=document.createElement('div'); card.className='item-card';
    const cvs=document.createElement('canvas'); cvs.width=16; cvs.height=16;
    cvs.style.width='112px'; cvs.style.height='112px';
    fns[item.id](cvs.getContext('2d'));
    const h4=document.createElement('h4'); h4.textContent=item.name;
    const p=document.createElement('p'); p.textContent='16×16 · '+item.desc;
    card.appendChild(cvs); card.appendChild(h4); card.appendChild(p);

  });
})();

name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          CURRENT=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MAJOR=$(echo $CURRENT | cut -d'.' -f1)
          MINOR=$(echo $CURRENT | cut -d'.' -f2)
          PATCH=$(echo $CURRENT | cut -d'.' -f3)

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="$MAJOR.$MINOR.$PATCH"

          sed -i "s/mod_version = .*/mod_version = $NEW/" gradle.properties
          # Sync version numbers in README, website and store descriptions
          # so the docs are part of the tagged release commit.
          python3 scripts/sync-release-docs.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties README.md docs/
          git commit -m "chore: bump version to $NEW [skip ci]"
          git tag "v$NEW"
          git push origin master
          git push origin "v$NEW"

          echo "tag=v$NEW" >> $GITHUB_OUTPUT

      # Tags and pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so start the release build and the website deploy explicitly.
      - name: Trigger release
        run: gh workflow run release.yml -f tag=${{ steps.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy website
        run: gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
